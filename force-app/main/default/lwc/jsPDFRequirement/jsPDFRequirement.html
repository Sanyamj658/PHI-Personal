<template>

    <!-- Custom Show Toast Component -->
    <c-common-toast></c-common-toast>

    <template if:true={isRefreshClicked}>
        <div class="slds-spinner_container">
            <div role="status" class="slds-spinner slds-spinner_medium">
                <div class="slds-spinner__dot-a"></div>
                <div class="slds-spinner__dot-b"></div>
            </div>
        </div>
    </template>

    <div class="slds-p-around_small">
        <p class="slds-text-heading_medium slds-text-align_center">PassageHI</p>
        <br />

        <!-- Comment 1 -->
        <div class="slds-form-element">
            <label for="comment1">Enter Comment 1 for the Invoice:</label>
            <div class="slds-input_container">
                <input type="text" value={comment1} placeholder="Comment 1..." class="slds-input" name="comment1" onchange={handleComments} />
            </div>
        </div>

        <!-- Comment 2 -->
        <div class="slds-form-element">
            <label for="comment2">Enter Comment 2 for the Invoice:</label>
            <div class="slds-input_container">
                <input type="text" value={comment2} placeholder="Comment 2..." class="slds-input" name="comment2" onchange={handleComments} />
            </div>
        </div>

        <!-- Download Invoice -->
        <div class="slds-form-element slds-text-align_right">
            <br />
            <div class="slds-button_container slds-p-top_small slds-">
                <lightning-button variant="brand" label="Generate PDF" onclick={handleGeneratePDF}></lightning-button>
            </div>
        </div>
    </div>
</template>
